<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Desktop</title>
<style>
  :root {
    --panel-bg: rgba(12, 12, 16, 0.82);
    --panel-fg: #f2e9e4;
    --muted: #a89c96;
    --accent: #ff5a1f;
  }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #07080b;
    color: var(--panel-fg);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  canvas { display: block; }
  #preview {
    position: fixed;
    top: 16px;
    left: 16px;
    width: 220px;
    border-radius: 6px;
    transform: scaleX(-1);
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.6);
    display: none;
  }
  #preview.visible { display: block; }
  #panel {
    position: fixed;
    right: 16px;
    bottom: 16px;
    width: 280px;
    padding: 14px 16px;
    background: var(--panel-bg);
    border: 1px solid rgba(255, 90, 31, 0.35);
    border-radius: 10px;
    backdrop-filter: blur(6px);
  }
  #panel.hidden { display: none; }
  #toggle {
    position: fixed;
    top: calc(12px + env(safe-area-inset-top, 0px));
    right: 16px;
    width: auto;
    margin: 0;
    padding: 6px 12px;
    background: var(--panel-bg);
    color: var(--panel-fg);
    border: 1px solid rgba(255, 90, 31, 0.35);
  }
  .file {
    display: block;
    padding: 8px 10px;
    margin-bottom: 10px;
    border-radius: 6px;
    border: 1px dashed rgba(255, 90, 31, 0.6);
    text-align: center;
    cursor: pointer;
  }
  .file input { display: none; }
  @media (max-width: 600px) {
    #panel {
      left: 16px;
      right: 16px;
      bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      width: auto;
      max-height: 65vh;
      overflow-y: auto;
    }
    #preview { width: 28vw; top: calc(16px + env(safe-area-inset-top, 0px)); }
    .keys { display: none; }
  }
  #panel h1 {
    margin: 0 0 4px;
    font-size: 15px;
    letter-spacing: 0.02em;
  }
  #status { color: var(--muted); margin-bottom: 10px; min-height: 18px; }
  #status.ok { color: #7ee08a; }
  #status.err { color: #ff8a7a; }
  button {
    width: 100%;
    padding: 8px 10px;
    margin-bottom: 10px;
    border: 0;
    border-radius: 6px;
    background: var(--accent);
    color: #1a0a04;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  label {
    display: grid;
    grid-template-columns: 1fr 70px;
    align-items: center;
    gap: 8px;
    margin: 6px 0;
  }
  label.check { grid-template-columns: 1fr auto; }
  body:not(.has-photo) .photo-only { display: none; }
  input[type=number], select {
    width: 100%;
    box-sizing: border-box;
    padding: 3px 6px;
    background: #1b1c22;
    color: var(--panel-fg);
    border: 1px solid #33343c;
    border-radius: 4px;
    font: inherit;
  }
  input[type=range] { grid-column: 1 / -1; accent-color: var(--accent); }
  .hint { color: var(--muted); font-size: 12px; margin-top: 10px; }
  kbd {
    padding: 0 4px;
    border: 1px solid #44454d;
    border-radius: 3px;
    font: 11px ui-monospace, monospace;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/vision_bundle.mjs"
  }
}
</script>
</head>
<body>
<video id="preview" playsinline muted></video>

<button id="toggle" type="button">Settings</button>
<div id="panel">
  <h1>3D Desktop</h1>
  <div id="status">Move the mouse to look around, or turn on head tracking.</div>
  <button id="start">Start head tracking</button>
  <label class="file">Load photo scene…
    <input id="load" type="file" accept=".json,.js,.html,application/json,text/html,text/javascript">
  </label>
  <label class="photo-only">Scene
    <select id="scene">
      <option value="photo">Photo</option>
      <option value="grid">Grid room</option>
    </select>
  </label>
  <label class="photo-only">Photo depth (cm)
    <input id="depth" type="number" min="20" max="1000" step="10">
  </label>
  <label class="photo-only">Framing (0 = top, 1 = bottom)
    <input id="framing" type="number" min="0" max="1" step="0.05">
  </label>
  <label>Screen size (inches, diagonal)
    <input id="diag" type="number" min="4" max="100" step="0.1">
  </label>
  <label>Webcam field of view (°)
    <input id="fov" type="number" min="30" max="120" step="1">
  </label>
  <label>Parallax boost
    <input id="boost" type="number" min="0.5" max="3" step="0.1">
  </label>
  <label class="check">Flip left/right <input id="flip" type="checkbox"></label>
  <label class="check">Show webcam <input id="showcam" type="checkbox"></label>
  <div class="hint">
    <span class="keys"><kbd>F</kbd> fullscreen · <kbd>H</kbd> hide this panel · <kbd>V</kbd> webcam preview.</span>
    The effect is meant for one eye or a camera. Hold or sit about an arm's length away.
  </div>
</div>

<!-- Optional photo scene generated by tools/make_scene.py. -->
<script src="scene.js"></script>
<script type="module">
import * as THREE from 'three';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

// All scene units are centimetres. The physical screen is the rectangle at z = 0,
// centred on the origin; the "room" extends behind it into negative z.

// ---------------------------------------------------------------- settings

// Phones are held closer and have smaller screens and narrower front cameras.
const isPhone = matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) < 600;
const DEFAULTS = {
  diag: isPhone ? 6.1 : 15.6, fov: isPhone ? 55 : 60, boost: 1.0, flip: false, showcam: true,
  scene: 'photo', depth: isPhone ? 35 : 60, framing: window.SCENE?.focus ?? 0.5,
};
const settings = { ...DEFAULTS };
try {
  Object.assign(settings, JSON.parse(localStorage.getItem('3d-desktop-settings') || '{}'));
} catch {}

// URL parameters override settings without saving them, e.g. ?diag=27&scene=grid.
// ?record hides the UI and exposes window.setHead(x, y, z) for rendering videos.
const params = new URLSearchParams(location.search);
for (const key of Object.keys(DEFAULTS)) {
  if (!params.has(key)) continue;
  const v = params.get(key);
  settings[key] = typeof DEFAULTS[key] === 'number' ? parseFloat(v)
    : typeof DEFAULTS[key] === 'boolean' ? v !== 'false' : v;
}
const recording = params.has('record');
function saveSettings() {
  try { localStorage.setItem('3d-desktop-settings', JSON.stringify(settings)); } catch {}
}

const IPD_CM = 6.3;          // average distance between pupils
const WEBCAM_ABOVE_CM = isPhone ? 0 : 0.8; // camera sits this far above the top edge of the screen
const VIEW_DISTANCE = isPhone ? 30 : 60;    // typical eye distance from the screen
const DEFAULT_HEAD = new THREE.Vector3(0, 0, VIEW_DISTANCE);

// Physical size of the browser window, assuming the window fills the display.
function windowSizeCm() {
  const sw = screen.width, sh = screen.height;
  const screenWidthCm = settings.diag * 2.54 * sw / Math.hypot(sw, sh);
  const cmPerPx = screenWidthCm / sw;
  return { w: innerWidth * cmPerPx, h: innerHeight * cmPerPx };
}

// ---------------------------------------------------------------- renderer

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x07080b);
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera();
camera.matrixAutoUpdate = true;

// Off-axis ("window") projection: the eye sits at `head`, and the frustum is
// stretched so its near plane maps exactly onto the physical screen rectangle.
function applyOffAxis(head, w, h) {
  const near = 1, far = 2000;
  camera.position.copy(head);
  camera.quaternion.identity();
  camera.updateMatrixWorld();
  const s = near / head.z;
  camera.projectionMatrix.makePerspective(
    (-w / 2 - head.x) * s, (w / 2 - head.x) * s,
    (h / 2 - head.y) * s, (-h / 2 - head.y) * s,
    near, far
  );
  camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();
}

// ---------------------------------------------------------------- room

const gridMaterialBase = {
  vertexShader: /* glsl */`
    varying vec3 vW;
    void main() {
      vec4 w = modelMatrix * vec4(position, 1.0);
      vW = w.xyz;
      gl_Position = projectionMatrix * viewMatrix * w;
    }`,
  fragmentShader: /* glsl */`
    uniform vec3 uA, uB, uOrigin;
    uniform vec2 uCell;
    uniform float uDepth;
    varying vec3 vW;
    void main() {
      vec3 p = vW - uOrigin;
      vec2 c = vec2(dot(p, uA), dot(p, uB)) / uCell;
      vec2 d = abs(fract(c - 0.5) - 0.5);       // distance to nearest line, in cells
      vec2 aa = fwidth(c) * 0.75;
      vec2 halfW = vec2(0.035);
      vec2 l = 1.0 - smoothstep(halfW - aa, halfW + aa, d);
      float line = max(l.x, l.y);
      float glow = max(exp(-d.x * 22.0), exp(-d.y * 22.0)) * 0.18;
      float fade = mix(1.0, 0.7, clamp(-vW.z / uDepth, 0.0, 1.0));
      vec3 bg = vec3(0.028, 0.03, 0.04);
      vec3 orange = vec3(1.0, 0.33, 0.07);
      gl_FragColor = vec4(bg + orange * (line + glow) * fade, 1.0);
    }`,
};

const room = new THREE.Group();
scene.add(room);

function buildRoom(w, h) {
  room.children.forEach(m => { m.geometry.dispose(); m.material.dispose(); });
  room.clear();

  const depth = Math.max(w, h) * 1.1;
  const cellX = w / 12;
  const cellY = h / Math.max(1, Math.round(h / cellX));
  const cellZ = depth / Math.max(1, Math.round(depth / cellX));
  const origin = new THREE.Vector3(-w / 2, -h / 2, 0);
  const X = new THREE.Vector3(1, 0, 0), Y = new THREE.Vector3(0, 1, 0), Z = new THREE.Vector3(0, 0, 1);

  const walls = [
    // [width, height, position, rotation, axisA, axisB, cell]
    [w, h, [0, 0, -depth], [0, 0, 0], X, Y, [cellX, cellY]],                     // back
    [w, depth, [0, -h / 2, -depth / 2], [-Math.PI / 2, 0, 0], X, Z, [cellX, cellZ]], // floor
    [w, depth, [0, h / 2, -depth / 2], [Math.PI / 2, 0, 0], X, Z, [cellX, cellZ]],   // ceiling
    [depth, h, [-w / 2, 0, -depth / 2], [0, Math.PI / 2, 0], Z, Y, [cellZ, cellY]],  // left
    [depth, h, [w / 2, 0, -depth / 2], [0, -Math.PI / 2, 0], Z, Y, [cellZ, cellY]],  // right
  ];
  for (const [pw, ph, pos, rot, a, b, cell] of walls) {
    const mat = new THREE.ShaderMaterial({
      ...gridMaterialBase,
      side: THREE.DoubleSide,
      uniforms: {
        uA: { value: a }, uB: { value: b }, uOrigin: { value: origin },
        uCell: { value: new THREE.Vector2(...cell) }, uDepth: { value: depth },
      },
    });
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(pw, ph), mat);
    mesh.position.set(...pos);
    mesh.rotation.set(...rot);
    room.add(mesh);
  }

  // Soft contact shadow under the meatball.
  const shadow = new THREE.Mesh(
    new THREE.PlaneGeometry(1, 1),
    new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      vertexShader: /* glsl */`
        varying vec2 vUv;
        void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: /* glsl */`
        varying vec2 vUv;
        void main() {
          float r = length(vUv - 0.5) * 2.0;
          gl_FragColor = vec4(0.0, 0.0, 0.0, 0.75 * pow(1.0 - smoothstep(0.0, 1.0, r), 1.6));
        }`,
    })
  );
  shadow.rotation.x = -Math.PI / 2;
  room.add(shadow);
  room.userData = { depth, shadow };
}

// ---------------------------------------------------------------- meatball

// Small deterministic value-noise for baking the lumpy surface on the CPU.
function hash3(x, y, z) {
  let h = Math.imul(x, 374761393) ^ Math.imul(y, 668265263) ^ Math.imul(z, 1274126177);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
}
function valueNoise(x, y, z) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const s = t => t * t * (3 - 2 * t);
  const u = s(xf), v = s(yf), w = s(zf);
  const lerp = (a, b, t) => a + (b - a) * t;
  const c = (dx, dy, dz) => hash3(xi + dx, yi + dy, zi + dz);
  return lerp(
    lerp(lerp(c(0, 0, 0), c(1, 0, 0), u), lerp(c(0, 1, 0), c(1, 1, 0), u), v),
    lerp(lerp(c(0, 0, 1), c(1, 0, 1), u), lerp(c(0, 1, 1), c(1, 1, 1), u), v),
    w
  );
}
function fbm(x, y, z) {
  let sum = 0, amp = 0.5, freq = 1;
  for (let i = 0; i < 4; i++) {
    sum += amp * valueNoise(x * freq, y * freq, z * freq);
    freq *= 2.03; amp *= 0.5;
  }
  return sum / 0.9375;
}
// Radius of the lumpy unit meatball in direction d, plus a 0..1 cavity value.
function lump(d) {
  const n = fbm(d.x * 1.6 + 7, d.y * 1.6 + 3, d.z * 1.6 + 11);
  const fine = fbm(d.x * 6 + 1, d.y * 6 + 5, d.z * 6 + 2);
  const v = 0.75 * n + 0.25 * fine;
  return { r: 1 + 0.16 * (v - 0.5) * 2, cav: v };
}

const FUR_SHELLS = 48;
const FUR_LENGTH = 0.05; // fraction of the radius

function buildMeatball() {
  const group = new THREE.Group();

  // Body + fur shells: one lumpy sphere drawn FUR_SHELLS times, each copy pushed
  // further out along the normal. The fragment shader cuts each shell down to
  // the cross-sections of individual strands.
  let geo = new THREE.IcosahedronGeometry(1, 48);
  geo.deleteAttribute('normal');
  geo.deleteAttribute('uv');
  geo = mergeVertices(geo);
  const pos = geo.attributes.position;
  const dir = new Float32Array(pos.count * 3);
  const cav = new Float32Array(pos.count);
  const d = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    d.fromBufferAttribute(pos, i).normalize();
    const { r, cav: c } = lump(d);
    dir.set([d.x, d.y, d.z], i * 3);
    cav[i] = c;
    pos.setXYZ(i, d.x * r, d.y * r, d.z * r);
  }
  geo.setAttribute('dir', new THREE.BufferAttribute(dir, 3));
  geo.setAttribute('cav', new THREE.BufferAttribute(cav, 1));
  geo.computeVertexNormals();

  const furUniforms = {
    uTime: { value: 0 },
    uShells: { value: FUR_SHELLS },
    uFurLen: { value: FUR_LENGTH },
    uDensity: { value: 150 },
  };
  const furMat = new THREE.ShaderMaterial({
    uniforms: furUniforms,
    vertexShader: /* glsl */`
      uniform float uTime, uShells, uFurLen;
      attribute vec3 dir;
      attribute float cav;
      varying vec3 vN, vW, vDir;
      varying float vH, vCav;
      void main() {
        float h = float(gl_InstanceID) / (uShells - 1.0);
        vec3 sway = vec3(sin(uTime * 1.3 + dir.y * 5.0), 0.0, cos(uTime * 1.1 + dir.x * 4.0)) * 0.25;
        vec3 bend = (vec3(0.0, -1.0, 0.0) + sway) * uFurLen * 0.45 * h * h;
        vec3 p = position + normal * h * uFurLen + bend;
        vec4 w = modelMatrix * vec4(p, 1.0);
        vW = w.xyz;
        vN = normalize(mat3(modelMatrix) * normal);
        vDir = dir;
        vH = h;
        vCav = cav;
        gl_Position = projectionMatrix * viewMatrix * w;
      }`,
    fragmentShader: /* glsl */`
      uniform float uDensity;
      varying vec3 vN, vW, vDir;
      varying float vH, vCav;

      float hash13(vec3 p) {
        p = fract(p * 0.1031);
        p += dot(p, p.zyx + 31.32);
        return fract((p.x + p.y) * p.z);
      }
      vec3 hash33(vec3 p) {
        p = fract(p * vec3(0.1031, 0.1030, 0.0973));
        p += dot(p, p.yxz + 33.33);
        return fract((p.xxy + p.yxx) * p.zyx);
      }
      vec3 toLinear(vec3 c) { return pow(c, vec3(2.2)); }

      void main() {
        float h = vH;
        vec3 dirN = normalize(vDir);

        // Which strand does this fragment belong to? Strands sit at jittered
        // centres of a 3D grid of cells laid over the unit sphere.
        vec3 q = dirN * uDensity;
        vec3 cell = floor(q);
        vec3 off = fract(q) - 0.5 - (hash33(cell) - 0.5) * 0.7;
        off -= dot(off, dirN) * dirN;
        float dist = length(off);
        float rnd = hash13(cell);
        float len = mix(0.45, 1.0, rnd);
        if (h > 0.0) {
          if (h > len) discard;
          float thick = 0.5 * (1.0 - h / len) + 0.05;
          if (dist > thick) discard;
        }

        vec3 N = normalize(vN);
        vec3 V = normalize(cameraPosition - vW);
        vec3 Lk = normalize(vec3(-0.5, 0.75, 0.6));   // key light, upper left front
        vec3 Lb = normalize(vec3(0.6, 0.35, -0.8));   // back light for translucency

        float t = h / len;
        vec3 root = toLinear(vec3(0.36, 0.07, 0.05));
        vec3 mid  = toLinear(vec3(0.80, 0.30, 0.24));
        vec3 tip  = toLinear(vec3(0.96, 0.62, 0.54));
        vec3 alb = mix(root, mid, smoothstep(0.0, 0.5, t));
        alb = mix(alb, tip, smoothstep(0.55, 1.0, t) * 0.55);
        alb *= mix(0.8, 1.15, rnd);

        float ao = mix(0.3, 1.0, h) * mix(0.5, 1.0, smoothstep(0.2, 0.75, vCav));

        // Cheap subsurface scattering: red light wraps further around the
        // terminator than green and blue, and light bleeds through the rim.
        float ndl = dot(N, Lk);
        vec3 wrap = vec3(0.7, 0.3, 0.22);
        vec3 diff = clamp((ndl + wrap) / (1.0 + wrap), 0.0, 1.0);
        diff *= diff;
        float trans = pow(clamp(dot(V, -(Lb + N * 0.5)), 0.0, 1.0), 3.0);
        float rim = pow(1.0 - clamp(dot(N, V), 0.0, 1.0), 2.5);

        // Kajiya-Kay style sheen along the strand direction.
        vec3 H = normalize(Lk + V);
        float th = dot(N, H);
        float spec = pow(sqrt(max(0.0, 1.0 - th * th)), 70.0) * 0.12 * t;

        vec3 bounce = vec3(1.0, 0.3, 0.08) * clamp(-N.y, 0.0, 1.0) * 0.12;

        vec3 col = alb * (vec3(0.06, 0.03, 0.035) + diff * 1.6 + bounce) * ao;
        col += vec3(1.0, 0.22, 0.1) * trans * 0.6 * mix(0.6, 1.0, h);
        col += vec3(1.0, 0.5, 0.38) * rim * 0.35 * ao;
        col += vec3(1.0, 0.9, 0.85) * spec;

        col = 1.0 - exp(-col * 1.25);           // tone map
        gl_FragColor = vec4(pow(col, vec3(1.0 / 2.2)), 1.0);
      }`,
  });
  const fur = new THREE.InstancedMesh(geo, furMat, FUR_SHELLS);
  fur.frustumCulled = false;
  group.add(fur);

  // Long stray hairs (pale, sticking out) and short dark curly hairs lying on
  // the surface, both drawn as line segments that sway at their tips.
  const positions = [], colors = [], params = [];
  const rand = (a, b) => a + Math.random() * (b - a);
  const randomDir = () => new THREE.Vector3().randomDirection();
  function addStrand(points, rootColor, tipColor, seed) {
    for (let i = 0; i < points.length - 1; i++) {
      for (const j of [i, i + 1]) {
        const t = j / (points.length - 1);
        positions.push(points[j].x, points[j].y, points[j].z);
        const c = rootColor.clone().lerp(tipColor, t);
        colors.push(c.r, c.g, c.b);
        params.push(t, seed);
      }
    }
  }

  const paleRoot = new THREE.Color(0.45, 0.16, 0.12), paleTip = new THREE.Color(0.95, 0.9, 0.86);
  for (let n = 0; n < 1400; n++) {
    const base = randomDir();
    const r = lump(base).r;
    const out = base.clone().add(randomDir().multiplyScalar(0.45)).normalize();
    const side = randomDir().cross(out).normalize();
    const len = rand(0.05, 0.2);
    const curl = rand(-0.35, 0.35);
    const pts = [];
    for (let i = 0; i <= 5; i++) {
      const t = i / 5;
      pts.push(base.clone().multiplyScalar(r + FUR_LENGTH * 0.3)
        .addScaledVector(out, len * t)
        .addScaledVector(side, curl * len * t * t));
    }
    addStrand(pts, paleRoot, paleTip, Math.random());
  }

  const dark = new THREE.Color(0.09, 0.025, 0.02);
  for (let n = 0; n < 260; n++) {
    const base = randomDir();
    const r = lump(base).r + FUR_LENGTH * rand(0.7, 1.1);
    const t1 = randomDir().cross(base).normalize();
    const t2 = base.clone().cross(t1);
    const size = rand(0.015, 0.035);
    const turns = rand(0.35, 0.9) * Math.PI * 2;
    const phase = rand(0, Math.PI * 2);
    const pts = [];
    for (let i = 0; i <= 8; i++) {
      const a = phase + (i / 8) * turns;
      const rr = size * (0.3 + 0.7 * i / 8) * rand(0.8, 1.2);
      pts.push(base.clone().multiplyScalar(r)
        .addScaledVector(t1, Math.cos(a) * rr)
        .addScaledVector(t2, Math.sin(a) * rr)
        .addScaledVector(base, 0.01 * i / 8));
    }
    addStrand(pts, dark, dark, Math.random());
  }

  const hairGeo = new THREE.BufferGeometry();
  hairGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  hairGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  hairGeo.setAttribute('param', new THREE.Float32BufferAttribute(params, 2));
  const hairMat = new THREE.ShaderMaterial({
    uniforms: { uTime: furUniforms.uTime },
    transparent: true,
    depthWrite: false,
    vertexShader: /* glsl */`
      uniform float uTime;
      attribute vec3 color;
      attribute vec2 param;
      varying vec3 vColor;
      varying float vT;
      void main() {
        float t = param.x, seed = param.y * 6.2831;
        vec3 sway = vec3(sin(uTime * 1.7 + seed), cos(uTime * 1.3 + seed * 2.0) * 0.6 - 0.8, sin(uTime * 1.1 + seed * 3.0));
        vec3 p = position + sway * 0.012 * t * t;
        vColor = color;
        vT = t;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
      }`,
    fragmentShader: /* glsl */`
      varying vec3 vColor;
      varying float vT;
      void main() { gl_FragColor = vec4(vColor, 0.7 - 0.45 * vT); }`,
  });
  group.add(new THREE.LineSegments(hairGeo, hairMat));

  group.userData.uniforms = furUniforms;
  return group;
}

const meatball = buildMeatball();
scene.add(meatball);

// ---------------------------------------------------------------- photo scene

// A photo split into two depth-displaced layers (see tools/make_scene.py): an
// inpainted background and a cut-out foreground. Each vertex is pushed back
// along the ray from a design eye position, so from straight in front the photo
// looks untouched, and moving your head reveals real parallax.
const DESIGN_EYE = VIEW_DISTANCE;     // cm in front of the screen
const PHOTO_NEAR = isPhone ? 3 : 6;   // cm behind the screen for the nearest point in the photo

function buildPhotoScene(data) {
  const loader = new THREE.TextureLoader();
  const load = (uri, mipmaps) => {
    const tex = loader.load(uri);
    tex.generateMipmaps = mipmaps;
    tex.minFilter = mipmaps ? THREE.LinearMipmapLinearFilter : THREE.LinearFilter;
    tex.anisotropy = mipmaps ? renderer.capabilities.getMaxAnisotropy() : 1;
    return tex;
  };
  const photoTex = load(data.photo, true);
  const bgTex = load(data.background, true);
  const depthTex = load(data.depth, false);

  const uniforms = {
    tDepth: { value: depthTex },
    uRect: { value: new THREE.Vector4() }, // centre x, centre y, width, height on the screen plane (cm)
    uEye: { value: DESIGN_EYE },
    uNear: { value: PHOTO_NEAR },
    uFar: { value: settings.depth },
    uPad: { value: 0.25 },                 // mesh extends past the photo edges as a mirrored copy
  };
  const vertexShader = /* glsl */`
    uniform sampler2D tDepth;
    uniform vec4 uRect;
    uniform float uEye, uNear, uFar, uPad, uLayer;
    varying vec2 vSt;
    vec2 mirrorUv(vec2 st) { return 1.0 - abs(1.0 - abs(st)); }
    void main() {
      vec2 st = mix(vec2(-uPad), vec2(1.0 + uPad), uv);
      vSt = st;
      vec2 tuv = mirrorUv(st);
      vec4 dd = textureLod(tDepth, tuv, 0.0);
      float d = mix(dd.r, dd.g, uLayer);
      // The depth model predicts relative inverse depth, so interpolate 1/z.
      float dist = 1.0 / mix(1.0 / (uEye + uFar), 1.0 / (uEye + uNear), d);
      vec3 eye = vec3(0.0, 0.0, uEye);
      vec3 onScreen = vec3(uRect.xy + (st - 0.5) * uRect.zw, 0.0);
      vec3 p = eye + (onScreen - eye) * (dist / uEye);
      gl_Position = projectionMatrix * viewMatrix * vec4(p, 1.0);
    }`;
  const fragmentShader = /* glsl */`
    uniform sampler2D tColor, tDepth;
    uniform float uLayer, uPad;
    varying vec2 vSt;
    void main() {
      vec2 uv = 1.0 - abs(1.0 - abs(vSt));
      float a = uLayer > 0.5 ? texture(tDepth, uv).b : 1.0;
      if (a < 0.02) discard;
      // Past the photo's edges the mesh shows a mirrored copy; darken it gently.
      vec2 outside = max(-vSt, vSt - 1.0);
      float fade = 1.0 - smoothstep(0.0, uPad, max(outside.x, outside.y));
      gl_FragColor = vec4(texture(tColor, uv).rgb * mix(0.35, 1.0, fade), a);
    }`;

  const segX = 256, segY = Math.round(segX * data.height / data.width);
  const geo = new THREE.PlaneGeometry(1, 1, segX, segY);
  const group = new THREE.Group();
  [[bgTex, 0], [photoTex, 1]].forEach(([tex, layer]) => {
    const mat = new THREE.ShaderMaterial({
      uniforms: { ...uniforms, tColor: { value: tex }, uLayer: { value: layer } },
      vertexShader, fragmentShader,
      transparent: layer === 1,
      depthWrite: layer === 0,
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.frustumCulled = false;
    mesh.renderOrder = layer;
    group.add(mesh);
  });
  group.userData = { uniforms, aspect: data.width / data.height };
  return group;
}

let photo = null;

function setPhoto(data) {
  if (photo) {
    scene.remove(photo);
    photo.children.forEach(m => {
      Object.values(m.material.uniforms).forEach(u => u.value?.isTexture && u.value.dispose());
      m.material.dispose();
    });
    photo.children[0].geometry.dispose();
  }
  photo = buildPhotoScene(data);
  scene.add(photo);
  document.body.classList.add('has-photo');
  layoutPhoto();
  applyScene();
}

// A scene can come from scene.js next to this page, or from a file the viewer
// loads (scene JSON, scene.js, or a standalone .html). Loaded scenes are kept in
// this browser's IndexedDB, so the photo never leaves the device.
function parseScene(text) {
  const t = text.trim();
  const json = t.startsWith('{') ? t
    : t.match(/window\.SCENE\s*=\s*(\{[\s\S]*?\})\s*;\s*(?:<\/script>|$)/)?.[1];
  const data = json && JSON.parse(json);
  if (!data?.photo || !data?.background || !data?.depth) throw new Error('That file has no photo scene in it.');
  return data;
}
function sceneStore(mode, fn) {
  return new Promise((resolve, reject) => {
    const open = indexedDB.open('3d-desktop', 1);
    open.onupgradeneeded = () => open.result.createObjectStore('scenes');
    open.onerror = () => reject(open.error);
    open.onsuccess = () => {
      const tx = open.result.transaction('scenes', mode);
      const req = fn(tx.objectStore('scenes'));
      tx.oncomplete = () => resolve(req.result);
      tx.onerror = () => reject(tx.error);
    };
  });
}

// Cover the window with the photo (plus a margin for head movement), centred
// vertically on the framing point.
function layoutPhoto() {
  if (!photo) return;
  const { uniforms, aspect } = photo.userData;
  const margin = 1.25;
  let iw = size.w * margin, ih = iw / aspect;
  if (ih < size.h * margin) { ih = size.h * margin; iw = ih * aspect; }
  const maxOffset = (ih - size.h) / 2;
  const cy = THREE.MathUtils.clamp((settings.framing - 0.5) * ih, -maxOffset, maxOffset);
  uniforms.uRect.value.set(0, cy, iw, ih);
  uniforms.uFar.value = Math.max(settings.depth, PHOTO_NEAR + 1);
}

// A photo only has so much picture around its edges. Ease the eye position into
// the range where the background still covers the screen, instead of showing
// the mirrored edge as soon as you lean far to one side.
const limitedHead = new THREE.Vector3();
function limitForPhoto(h) {
  const { uniforms } = photo.userData;
  const r = uniforms.uRect.value, pad = uniforms.uPad.value, far = uniforms.uFar.value;
  const scale = (DESIGN_EYE + far) / far;
  const limX = Math.max(1, ((r.z - size.w) / 2 + 0.5 * pad * r.z) * scale);
  const limY = Math.max(1, ((r.w - size.h) / 2 + 0.5 * pad * r.w) * scale);
  return limitedHead.set(limX * Math.tanh(h.x / limX), limY * Math.tanh(h.y / limY), h.z);
}

function applyScene() {
  const isPhoto = settings.scene === 'photo' && !!photo;
  document.getElementById('scene').value = isPhoto ? 'photo' : 'grid';
  if (photo) photo.visible = isPhoto;
  room.visible = meatball.visible = !isPhoto;
  renderer.setClearColor(isPhoto ? 0x000000 : 0x07080b);
}

// ---------------------------------------------------------------- layout

let size = windowSizeCm();
function layout() {
  size = windowSizeCm();
  renderer.setSize(innerWidth, innerHeight);
  buildRoom(size.w, size.h);
  const R = Math.min(size.w, size.h) * 0.3;
  meatball.scale.setScalar(R);
  meatball.userData.baseY = -size.h * 0.04;
  meatball.position.set(0, meatball.userData.baseY, -R * 1.45);
  const shadow = room.userData.shadow;
  shadow.position.set(0, -size.h / 2 + 0.05, meatball.position.z);
  shadow.scale.setScalar(R * 2.4);
  layoutPhoto();
}
layout();
if (window.SCENE) {
  setPhoto(window.SCENE);
} else {
  sceneStore('readonly', st => st.get('current'))
    .then(text => text && setPhoto(parseScene(text)))
    .catch(() => {});
}
applyScene();
addEventListener('resize', layout);

// ---------------------------------------------------------------- head tracking

// One Euro filter: smooths jitter when the head is still, stays responsive when it moves.
class OneEuro {
  constructor(minCutoff = 1.2, beta = 0.015, dCutoff = 1.0) {
    Object.assign(this, { minCutoff, beta, dCutoff, x: null, dx: 0, t: null });
  }
  static alpha(cutoff, dt) { const r = 2 * Math.PI * cutoff * dt; return r / (r + 1); }
  filter(x, t) {
    if (this.x === null) { this.x = x; this.t = t; return x; }
    const dt = Math.max(1e-3, t - this.t);
    this.t = t;
    const dx = (x - this.x) / dt;
    this.dx += OneEuro.alpha(this.dCutoff, dt) * (dx - this.dx);
    const cutoff = this.minCutoff + this.beta * Math.abs(this.dx);
    this.x += OneEuro.alpha(cutoff, dt) * (x - this.x);
    return this.x;
  }
}

const video = document.getElementById('preview');
const statusEl = document.getElementById('status');
const startBtn = document.getElementById('start');
let landmarker = null;
let lastVideoTime = -1;
let lastFaceAt = 0;
const filters = [new OneEuro(), new OneEuro(), new OneEuro()];
const trackedHead = DEFAULT_HEAD.clone();

function setStatus(text, cls = '') {
  statusEl.textContent = text;
  statusEl.className = cls;
}

async function startTracking() {
  startBtn.disabled = true;
  try {
    setStatus('Asking for camera access…');
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' },
      audio: false,
    });
    video.srcObject = stream;
    await video.play();
    video.classList.toggle('visible', settings.showcam);

    setStatus('Loading face tracker…');
    const { FaceLandmarker, FilesetResolver } = await import('@mediapipe/tasks-vision');
    const fileset = await FilesetResolver.forVisionTasks(
      'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/wasm'
    );
    const options = delegate => ({
      baseOptions: {
        modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
        delegate,
      },
      runningMode: 'VIDEO',
      numFaces: 1,
    });
    try {
      landmarker = await FaceLandmarker.createFromOptions(fileset, options('GPU'));
    } catch {
      landmarker = await FaceLandmarker.createFromOptions(fileset, options('CPU'));
    }
    startBtn.textContent = 'Head tracking on';
    setStatus('Tracking. Move your head!', 'ok');
    keepAwake();
    if (isPhone) panel.classList.add('hidden');
  } catch (err) {
    console.error(err);
    startBtn.disabled = false;
    setStatus(`Couldn't start head tracking: ${err.message || err}`, 'err');
  }
}
startBtn.addEventListener('click', startTracking);

// Stop the screen from dimming while the camera drives the view.
let wakeLock = null;
async function keepAwake() {
  try { wakeLock = await navigator.wakeLock?.request('screen'); } catch {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && wakeLock?.released) keepAwake();
});

// Returns the head position in scene space (cm, relative to the screen centre),
// or null if no face was found in the latest webcam frame.
function readHead(nowMs) {
  if (!landmarker || video.readyState < 2 || video.currentTime === lastVideoTime) return undefined;
  lastVideoTime = video.currentTime;
  const res = landmarker.detectForVideo(video, nowMs);
  const lm = res.faceLandmarks?.[0];
  if (!lm) return null;

  const vw = video.videoWidth, vh = video.videoHeight;
  // Iris centres (478-point model): 468 and 473.
  const a = lm[468], b = lm[473];
  const ipdPx = Math.hypot((a.x - b.x) * vw, (a.y - b.y) * vh);
  const focalPx = (vw / 2) / Math.tan(THREE.MathUtils.degToRad(settings.fov) / 2);
  const z = focalPx * IPD_CM / ipdPx;
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
  let x = -(mx - 0.5) * vw * z / focalPx; // the webcam image is not mirrored
  if (settings.flip) x = -x;
  const y = size.h / 2 + WEBCAM_ABOVE_CM - (my - 0.5) * vh * z / focalPx;
  return new THREE.Vector3(x * settings.boost, y * settings.boost, THREE.MathUtils.clamp(z, 20, 250));
}

// Mouse fallback for when there is no webcam.
const mouse = { x: 0, y: 0, moved: false };
addEventListener('pointermove', e => {
  mouse.x = e.clientX / innerWidth - 0.5;
  mouse.y = e.clientY / innerHeight - 0.5;
  mouse.moved = true;
});

// ---------------------------------------------------------------- UI

const panel = document.getElementById('panel');
const inputs = {
  scene: document.getElementById('scene'),
  depth: document.getElementById('depth'),
  framing: document.getElementById('framing'),
  diag: document.getElementById('diag'),
  fov: document.getElementById('fov'),
  boost: document.getElementById('boost'),
  flip: document.getElementById('flip'),
  showcam: document.getElementById('showcam'),
};
for (const [key, el] of Object.entries(inputs)) {
  if (el.type === 'checkbox') el.checked = settings[key];
  else el.value = settings[key];
  el.addEventListener('change', () => {
    if (el.type === 'checkbox') settings[key] = el.checked;
    else if (el.tagName === 'SELECT') settings[key] = el.value;
    else settings[key] = Number.isFinite(parseFloat(el.value)) ? parseFloat(el.value) : DEFAULTS[key];
    saveSettings();
    if (key === 'diag') layout();
    if (key === 'depth' || key === 'framing') layoutPhoto();
    if (key === 'scene') applyScene();
    if (key === 'showcam') video.classList.toggle('visible', settings.showcam && !!video.srcObject);
  });
}
document.getElementById('toggle').addEventListener('click', () => panel.classList.toggle('hidden'));
document.getElementById('load').addEventListener('change', async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  try {
    const text = await file.text();
    const data = parseScene(text);
    settings.scene = 'photo';
    settings.framing = data.focus ?? 0.5;
    inputs.framing.value = settings.framing;
    saveSettings();
    setPhoto(data);
    try { await sceneStore('readwrite', st => st.put(text, 'current')); } catch {}
    setStatus(`Loaded ${file.name}.`, 'ok');
  } catch (err) {
    setStatus(`Couldn't load ${file.name}: ${err.message}`, 'err');
  }
});
addEventListener('keydown', e => {
  if (e.target instanceof HTMLInputElement) return;
  const k = e.key.toLowerCase();
  if (k === 'h') panel.classList.toggle('hidden');
  if (k === 'v') {
    settings.showcam = !settings.showcam;
    inputs.showcam.checked = settings.showcam;
    saveSettings();
    video.classList.toggle('visible', settings.showcam && !!video.srcObject);
  }
  if (k === 'f') {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen?.();
  }
});

// ---------------------------------------------------------------- loop

const head = DEFAULT_HEAD.clone();
const clock = new THREE.Clock();
let recordedHead = null;
if (recording) {
  panel.classList.add('hidden');
  document.getElementById('toggle').hidden = true;
  window.setHead = (x, y, z) => { recordedHead = new THREE.Vector3(x, y, z); };
}

renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  const nowMs = performance.now();

  let target;
  if (recordedHead) {
    head.copy(recordedHead);
  } else if (landmarker) {
    const h = readHead(nowMs);
    if (h) {
      lastFaceAt = nowMs;
      trackedHead.set(
        filters[0].filter(h.x, t),
        filters[1].filter(h.y, t),
        filters[2].filter(h.z, t)
      );
    }
    // If the face is lost for a while, drift back to the default viewpoint.
    target = nowMs - lastFaceAt < 1500 ? trackedHead : DEFAULT_HEAD;
    head.lerp(target, target === trackedHead ? 1 : 0.03);
  } else {
    target = mouse.moved
      ? new THREE.Vector3(mouse.x * size.w * 0.6, -mouse.y * size.h * 0.6, DEFAULT_HEAD.z)
      : new THREE.Vector3(Math.sin(t * 0.4) * size.w * 0.15, Math.sin(t * 0.27) * size.h * 0.08, DEFAULT_HEAD.z);
    head.lerp(target, 0.08);
  }

  meatball.userData.uniforms.uTime.value = t;
  meatball.rotation.y = t * 0.15;
  meatball.rotation.x = Math.sin(t * 0.21) * 0.15;
  meatball.position.y = meatball.userData.baseY + Math.sin(t * 0.8) * size.h * 0.015;

  applyOffAxis(photo?.visible ? limitForPhoto(head) : head, size.w, size.h);
  renderer.render(scene, camera);
});
</script>
</body>
</html>
